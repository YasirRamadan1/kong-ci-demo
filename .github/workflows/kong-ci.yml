name: kong-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: kong/setup-deck@v1
        with:
          deck-version: '1.43.1'
          wrapper: false

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Guard team files and build config
        run: python3 scripts/build.py build/kong.yaml

      - name: Validate built config (offline)
        run: deck file validate build/kong.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: kong-config
          path: build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kong-config
          path: build

      - name: Start Kong and httpbin
        run: docker compose up -d

      - name: Wait until Kong is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs localhost:8001/status > /dev/null; then
              echo "Kong is up"; exit 0
            fi
            sleep 1
          done
          echo "Kong did not start"; exit 1

      - name: Behavioural tests
        run: ./tests/run.sh

      - name: Show Kong logs if something failed
        if: failure()
        run: docker compose logs kong