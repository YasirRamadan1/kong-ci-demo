name: kong-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Start Kong and httpbin
        run: docker compose up -d

      - name: Wait until Kong is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs localhost:8001/status > /dev/null; then
              echo "Kong is up"
              exit 0
            fi
            sleep 1
          done
          echo "Kong did not start"
          exit 1

      - name: Behavioural tests
        run: ./tests/test.sh

      - name: Show Kong logs if something failed
        if: failure()
        run: docker compose logs kong