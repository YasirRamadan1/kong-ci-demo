services:
  kong:
    image: kong:3.9.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./build:/kong:ro
    depends_on:
      - httpbin
      - cards-mock
    ports:
      - "8000:8000"
      - "8001:8001"

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0

  # Mock backend for the cards team, generated from its OpenAPI spec.
  # build.py writes the spec (without security) to build/mocks/.
  cards-mock:
    image: stoplight/prism:5
    platform: linux/amd64
    command: mock -h 0.0.0.0 --multiprocess false /mocks/cards.openapi.yaml
    volumes:
      - ./build/mocks:/mocks:ro