services:
  kong:
    image: kong:3.9.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/kong:ro
    depends_on:
      - httpbin
    ports:
      - "8000:8000"
      - "8001:8001"

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
